services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bidguard
      POSTGRES_USER: bidguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bidguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidguard -d bidguard"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://bidguard:${POSTGRES_PASSWORD}@db:5432/bidguard
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      STORAGE_DIR: /app/backend/work/documents
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bidguard_documents:/app/backend/work/documents
    depends_on:
      db:
        condition: service_healthy
volumes:
  bidguard_pgdata:
  bidguard_documents:
