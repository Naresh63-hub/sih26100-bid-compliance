services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: bidguard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bidguard}
      POSTGRES_USER: ${POSTGRES_USER:-bidguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidguard_secure_pwd}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidguard} -d ${POSTGRES_DB:-bidguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bidguard-net

  # -------------------------------------------------------------------
  # 2. FastAPI Backend AI & Verification Engine
  # -------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bidguard_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bidguard:bidguard_secure_pwd@db:5432/bidguard}
      API_KEY: ${API_KEY:-bidguard-internal-secure-key}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      STORAGE_DIR: /app/backend/work/documents
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EXTRACTION_CONFIDENCE_THRESHOLD: ${EXTRACTION_CONFIDENCE_THRESHOLD:-0.8}
    ports:
      - "8000:8000"
    volumes:
      - backend_work:/app/backend/work/documents
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bidguard-net

  # -------------------------------------------------------------------
  # 3. React / Next.js Frontend Web Application
  # -------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidguard_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NODE_ENV: production
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - bidguard-net

# ---------------------------------------------------------------------
# Networks & Persistent Volumes
# ---------------------------------------------------------------------
networks:
  bidguard-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_work:
    driver: local
